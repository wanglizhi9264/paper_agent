services:
  postgres:
    image: postgres:16-alpine
    container_name: paper-rag-postgres
    environment:
      POSTGRES_USER: paper_rag
      POSTGRES_PASSWORD: paper_rag_dev
      POSTGRES_DB: paper_rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paper-rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_rag -d paper_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paper-rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - paper-rag-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  paper-rag-pgdata:
  paper-rag-redisdata:
