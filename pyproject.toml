[project]
name = "paper-rag-assistant"
version = "0.1.0"
description = "Local-first paper RAG assistant for single-user RTX 2060 setups."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "paper-rag-dev" }]

dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<26",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<0.31",
    "redis>=5.2,<6",
    "arq>=0.26,<0.27",
    "python-multipart>=0.0.12,<0.1",
    "httpx>=0.28,<0.29",
    "anyio>=4.6,<5",
    "pyyaml>=6.0.2,<7",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
ml = [
    # Heavy ML stack — installed explicitly for model-bearing hosts.
    "torch>=2.5,<3",
    "sentence-transformers>=3.3,<4",
    "faiss-cpu>=1.9,<2",
    "transformers>=4.46,<5",
    "numpy>=1.26,<3",
]
pdf-layout = [
    # Docling layout parser (PDF Ingestion V2-3, spec §15.1).
    # Pinned after a verified Windows/Python 3.12 CPU smoke; see memory.md.
    "docling==2.121.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<0.10",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "pytest-cov>=6.0,<7",
    "types-pyyaml>=6.0.2,<7",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "frontend", "storage"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET",
    "PT", "PL", "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "PLR0913", "PLR0912", "PLR0915", "PLR2004",  # allow rich signatures/branches/magic
    "RET504", "RET505",
    "B008",   # FastAPI Depends() default
    "PLW0603", # module-level cache via global is intentional
    "RUF001", "RUF002", "RUF003", # full-width CJK chars are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "D", "PT011", "RUF005"]
"app/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
packages = ["app"]
exclude = ["migrations/", "frontend/", "storage/", "eval/"]

[[tool.mypy.overrides]]
module = ["arq.*", "faiss.*", "sentence_transformers.*", "jieba.*", "pymupdf.*", "docx.*", "docx.oxml.*", "docx.table.*", "docx.text.*", "markdown_it.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "huggingface_hub.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL/Redis (skipped without --run-integration)",
    "model_smoke: requires real GPU model weights (deselect by default)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/workers/settings.py"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
